<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<form>
    
            <h2>Personal Information</h2>
            <label for="full name">Full name</label>
            <input type="text" name="full name" placeholder="Enter your full name" required>
             <br>
             <label for="email" >Email Address</label>
             <input type="email" name="email" placeholder="example@gmail.com" required>
             <br>
             <label>Phone Number</label>
             <input type="tel" name="phone" placeholder="0551234567" required>
              <br>
            <label for="date of birth">Date of Birth</label>
            <input type="date" name="date of birth" required>

      
            <h2>Academic Information</h2>
            <label>Program of Study</label>
            <select>
                <option>Computer Science</option>
                <option>Business Administration</option>
                <option>Engineering</option>
            </select>
            <br>
            <label>Previous School</label>
            <input type="text" placeholder="Enter previous school" required>
              <br>
              <label for="gradyear">Graduation Year</label>
              <input type="number" placeholder="2024" required>
        

        
              <h2>Skills</h2>
            <label>Choose a skill</label>
            <input type="checkbox">HTML 
            <input type="checkbox">CSS 
            <input type="checkbox">JavaScript
            <input type="checkbox">ProblemSolving
            <input type="checkbox">Communication
        

       
            <h2>Gender</h2>
             <input type="radio" name="gender">male
             <input type="radio" name="gender">female
             <input type="radio" name="gender">prefer not to say
       

       
            <h2>About Yourself</h2>
            <label for="about">Tell us about yourself</label>
             <br>
             <textarea></textarea>
       
         <br>
        <button>submit</button>
    </form>
</body>
</html>
