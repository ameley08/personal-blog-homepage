<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="full name">Full name</label>
            <input type="text" name="full name" placeholder="Enter your full name" required>
             <br>
             <label for="email" >Email Address</label>
             <input type="email" name="email" placeholder="example@gmail.com" required>
             <br>
             <label for="phone">Phone Number </label>
             <input type="tel" name="phone" placeholder="0551234567" required>
              <br>
            <label for="date of birth">Date of Birth</label>
            <input type="date" name="date of birth" required>
        </fieldset>

        <fieldset>
            <legend>Academic Information</legend>
            <label for="program">Program of Study</label>
            <select>
                <option>Computer Science</option>
                <option>Business Administration</option>
                <option>Engineering</option>
            </select>
            <br>
            <label for="school">Previous School</label>
            <input type="text" placeholder="Enter previous school" required>
              <br>
              <label for="gradyear">Graduation Year</label>
              <input type="number" placeholder="2024" required>
        </fieldset>

        <fieldset>
              <legend>Skills</legend>
            <label>Choose a skill</label>
            <input type="checkbox">HTML 
            <input type="checkbox">CSS 
            <input type="checkbox">JavaScript
            <input type="checkbox">ProblemSolving
            <input type="checkbox">Communication
        </fieldset>

        <fieldset>
            <legend>Gender</legend>
             <input type="radio" name="gender">male
             <input type="radio" name="gender">female
             <input type="radio" name="gender">prefer not to say
        </fieldset>

        <fieldset>
            <legend>About Yourself</legend>
            <label for="about">Tell us about yourself</label>
             <br>
             <textarea></textarea>
        </fieldset>
         <br>
         <button type="submit">Submit Application</button>
    </form>
    
</body>
</html>
